- id: a1003001-0000-4000-8001-000000000001
  name: T1003 shadow file open attempt
  description: >
    Opens /etc/shadow and closes the descriptor without reading or printing file bytes.
    Sandcat runs unprivileged, so the open is expected to fail with EACCES. The syscall
    is what auditd records. Intended to match a linux Sigma rule tagged attack.t1003
    on siem-linux-auditd (Security Analytics). Does not modify the file. Never prints
    password hashes. Requires auditd:
      -a always,exit -F arch=b64 -S openat -F path=/etc/shadow -k shadow_access
  tactic: credential_access
  technique:
    attack_id: T1003
    name: OS Credential Dumping
  executors:
  - platform: linux
    name: sh
    # Base64-wrapped. Sandcat's sh executor strips the newlines from a
    # multi-line command, so an inline multi-line `python3 -c "..."`
    # collapses onto one line and dies with a SyntaxError (the syscall
    # never fires). The script is base64 (no newlines) and decoded at run
    # time; it decodes to the Python this ability documents. (2026-11-12)
    command: |
      echo aW1wb3J0IG9zCnBhdGggPSAnL2V0Yy9zaGFkb3cnCnRyeToKICAgIGZkID0gb3Mub3BlbihwYXRoLCBvcy5PX1JET05MWSkKICAgIG9zLmNsb3NlKGZkKQogICAgcHJpbnQoJ3NoYWRvd19vcGVuPW9rIGJ5dGVzX3JlYWQ9MCcpCmV4Y2VwdCBPU0Vycm9yIGFzIGV4YzoKICAgIHByaW50KCdzaGFkb3dfb3Blbj1mYWlsIGVycm5vPSVzJyAlIChleGMuZXJybm8sKSkK | base64 -d | python3 2>&1 || true
    cleanup:
    - |
      true

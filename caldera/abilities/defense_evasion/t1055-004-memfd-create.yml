- id: a1055004-0000-4000-8004-000000000004
  name: T1055 memfd_create Fileless Injection
  description: >
    Calls the memfd_create(2) syscall via Python ctypes to create an anonymous in-memory
    file descriptor. This is the first step of fileless shared-object injection (load
    a .so into an anonymous fd without touching disk). Intended to trigger the Sigma rule
    "Linux memfd_create Anonymous In-Memory File". The fd is immediately closed; no shellcode or library
    is actually loaded. Requires auditd syscall monitoring for memfd_create (or a
    fallback execve rule).
  tactic: defense_evasion
  technique:
    attack_id: T1055
    name: Process Injection
  executors:
  - platform: linux
    name: sh
    # Base64-wrapped. Sandcat's sh executor strips the newlines from a
    # multi-line command, so an inline multi-line `python3 -c "..."`
    # collapses onto one line and dies with a SyntaxError (the syscall
    # never fires). The script is base64 (no newlines) and decoded at run
    # time; it decodes to the Python this ability documents. (2026-11-12)
    command: |
      echo  | base64 -d | python3 2>&1 || true
    cleanup:
    - |
      true

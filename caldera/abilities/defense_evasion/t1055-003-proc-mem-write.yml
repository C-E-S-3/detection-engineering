- id: a1055003-0000-4000-8003-000000000003
  name: T1055 /proc/PID/mem Write Attempt
  description: >
    Attempts to open /proc/<ppid>/mem for writing from Python. The open() syscall
    against /proc/PID/mem is captured by auditd and intended to trigger the Sigma rule
    "Linux Process Memory Opened Via /proc/pid/mem" (a failed open still counts). The open will fail with EACCES or EPERM (expected);
    the auditd log entry of the attempt is what matters for detection validation.
    No memory is actually modified. Requires auditd: -a always,exit -F arch=b64 -S
    openat,open -F path=/proc -k proc_access
  tactic: defense_evasion
  technique:
    attack_id: T1055
    name: Process Injection
  executors:
  - platform: linux
    name: sh
    # Base64-wrapped. Sandcat's sh executor strips the newlines from a
    # multi-line command, so an inline multi-line `python3 -c "..."`
    # collapses onto one line and dies with a SyntaxError (the syscall
    # never fires). The script is base64 (no newlines) and decoded at run
    # time; it decodes to the Python this ability documents. (2026-11-12)
    command: |
      echo  | base64 -d | python3 2>&1 || true
    cleanup:
    - |
      true

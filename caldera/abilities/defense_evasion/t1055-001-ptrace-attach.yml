- id: a1055001-0000-4000-8001-000000000001
  name: T1055 ptrace PTRACE_ATTACH
  description: >
    Calls ptrace(PTRACE_ATTACH, ppid) against the parent process of the current shell.
    The call will normally fail with EPERM unless the implant is root, but the syscall
    itself is what auditd captures. Intended to trigger the Sigma rule "Linux Ptrace
    Attach Or Poke By A Non-Debugger". Requires auditd to
    be configured with:
      -a always,exit -F arch=b64 -S ptrace -F a0=0x10 -k process_injection
  tactic: defense_evasion
  technique:
    attack_id: T1055
    name: Process Injection
  executors:
  - platform: linux
    name: sh
    # Base64-wrapped. Sandcat's sh executor strips the newlines from a
    # multi-line command, so an inline multi-line `python3 -c "..."`
    # collapses onto one line and dies with a SyntaxError (the syscall
    # never fires). The script is base64 (no newlines) and decoded at run
    # time; it decodes to the Python this ability documents. (2026-11-12)
    command: |
      echo aW1wb3J0IGN0eXBlcywgb3MKbGliYyA9IGN0eXBlcy5DRExMKE5vbmUpClBUUkFDRV9BVFRBQ0ggPSAxNgp0YXJnZXQgPSBvcy5nZXRwcGlkKCkKcmV0ID0gbGliYy5wdHJhY2UoUFRSQUNFX0FUVEFDSCwgdGFyZ2V0LCAwLCAwKQplcnIgPSBjdHlwZXMuZ2V0X2Vycm5vKCkKcHJpbnQoZidwdHJhY2UoUFRSQUNFX0FUVEFDSCwge3RhcmdldH0pIHJldD17cmV0fSBlcnJubz17ZXJyfScpCg== | base64 -d | python3 2>&1 || true
    cleanup:
    - |
      true

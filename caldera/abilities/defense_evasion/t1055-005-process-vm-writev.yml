- id: a1055005-0000-4000-8005-000000000005
  name: T1055 process_vm_writev Cross-Process Memory Write
  description: >
    Calls process_vm_writev(2) targeting the parent process. This syscall allows direct
    cross-process memory writes without ptrace and is a common process injection technique.
    The call will fail with EPERM unless ptrace_scope allows it, but the syscall itself
    is logged by auditd. Intended to trigger the Sigma rule "Linux process_vm_writev
    Cross-Process Memory Write". No memory is successfully modified in the expected permission-denied
    case.
  tactic: defense_evasion
  technique:
    attack_id: T1055
    name: Process Injection
  executors:
  - platform: linux
    name: sh
    # Base64-wrapped. Sandcat's sh executor strips the newlines from a
    # multi-line command, so an inline multi-line `python3 -c "..."`
    # collapses onto one line and dies with a SyntaxError (the syscall
    # never fires). The script is base64 (no newlines) and decoded at run
    # time; it decodes to the Python this ability documents. (2026-11-12)
    command: |
      echo  | base64 -d | python3 2>&1 || true
    cleanup:
    - |
      true

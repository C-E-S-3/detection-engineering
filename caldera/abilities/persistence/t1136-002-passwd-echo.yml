- id: a1136002-0000-4000-8002-000000000002
  name: T1136 /etc/passwd Modification via echo Append
  description: >
    Appends a test passwd entry for pt_echotest to /etc/passwd using echo >>.
    Intended to trigger Wazuh FIM rules 100852 (/etc/passwd modified) and auditd
    rule 100857 (/etc/passwd written by non-root, if not root). The entry uses
    uid/gid 9998 which is outside normal ranges; no home directory is created.
    Cleanup uses sed to remove the injected line.
    Requires Wazuh FIM monitoring of /etc/passwd (syscheck in ossec.conf).
  tactic: persistence
  technique:
    attack_id: T1136
    name: Create Account
  platforms:
    linux:
      sh:
        command: |
          echo "pt_echotest:x:9998:9998:Purple Team Phase2 Echo Test:/home/pt_echotest:/bin/false" >> /etc/passwd
          grep pt_echotest /etc/passwd && echo "passwd_echo_test: entry written"
        cleanup: |
          sed -i '/^pt_echotest:/d' /etc/passwd 2>/dev/null || true
          echo "passwd_echo_cleanup: pt_echotest entry removed"

# Phase 2 Purple Team Exercise — Caldera Operation Template
#
# Use this document as the body for POST /api/v2/operations (authenticated with
# the Caldera API KEY header). Import the adversary and abilities first via the
# Caldera plugin/REST API before creating the operation.
#
# MITRE ATT&CK coverage: T1190, T1055, T1078, T1136, T1003
# Expected detections: OpenSearch Sigma tags attack.t1190 / t1055 / t1078 /
# t1136 / t1003. Score with caldera/validate-detections.py. Not Wazuh rules.

name: Phase 2 Purple Team Exercise
adversary_id: adv00002-0000-4000-8000-000000000002

# --- Execution settings ---
# 'sequential' planner runs abilities one at a time in atomic_ordering order.
# Use 'atomic' for unordered execution if order doesn't matter.
planner: sequential

# Agent group containing the exercise host(s).
# All hosts in the group must have the Caldera sandcat agent installed.
group: purple-team-phase2

# Jitter between ability executions (min/max seconds).
# Keeps traffic patterns from being perfectly periodic.
jitter: 3/10

# Fact source providing #{app.web_target}, #{host.target}, #{host.ssh.keyfile},
# #{host.ssh.svcacct.keyfile}. Create a Caldera source named 'phase2-facts'
# and populate it with host-specific values before running the operation.
source: phase2-facts

# Obfuscator: 'plain-text' for detection testing (no encoding; makes detections
# easier to verify). Change to 'base64' if testing evasion of detection gaps.
obfuscator: plain-text

# Auto-close the operation when all abilities have run.
auto_close: true

# Visibility: 51 = default (show all ability output in UI).
visibility: 51

# State: 'running' starts the operation immediately on POST.
state: running

# --- Fact / Variable Reference ---
# Populate these in the 'phase2-facts' Caldera source before running:
#
#   app.web_target      <IP or hostname:port of web target accessible to the agent>
#   host.target         <IP or hostname of SSH target>
#   host.target.user    <non-root SSH user on target for T1078-001/002>
#   host.ssh.keyfile    <path to private key file on agent host for target SSH>
#   host.ssh.svcacct.keyfile  <path to private key for svc_purpleteam on target>
#
# NOTE: Do not put internal hostnames or IPs directly in this file.
# Caldera resolves #{...} variables at operation runtime from the source above.

# --- Pre-exercise Checklist ---
#
# 1. Traefik / web target:
#    - Confirm Traefik access logs are arriving on siem-traefik
#    - Confirm #{app.web_target} is reachable from the Caldera agent host
#    - Confirm Sigma rules tagged attack.t1190 are loaded on the traefik detector
#
# 2. SSH / T1078 setup:
#    - Deploy #{host.target.user} SSH authorized key on #{host.target}
#    - Create svc_purpleteam account on #{host.target} with authorized key
#    - Score T1078 only against siem-linux-auditd (attack.t1078)
#
# 3. auditd / T1055 and T1003:
#    - Confirm auditd is recording the injection syscalls and openat of /etc/shadow
#    - Those events ship to siem-linux-auditd (and Sysmon for Linux to siem-linux-sysmon)
#
# 4. T1136:
#    - The ability cleanup must still remove pt_testuser
#    - There is no attack.t1136 Sigma rule yet; the validator reports NO RULE
#
# --- Post-exercise Verification ---
#
# Run caldera/validate-detections.py against OpenSearch for the exercise window.
# Do not confirm individual Wazuh rule ids. Per technique the report is
# DETECTED, NOT DETECTED, or NO RULE, with the Sigma rule title, id, and timestamp.
# NO RULE items go to the Sigma backlog. Do not write a Wazuh XML rule for them.

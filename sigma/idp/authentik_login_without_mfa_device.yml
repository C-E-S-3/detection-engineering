title: Authentik Successful Login Without MFA Device
id: 0b096609-eae6-4e75-8d84-4e29ec27b3a4
status: experimental
description: |
    Detects an Authentik login event whose authentication context lists no MFA device,
    i.e. the session was established with a single factor (password only, app password,
    token, LDAP/RADIUS outpost bind or another alternate method). Where MFA is enforced,
    this indicates an MFA downgrade or bypass using valid credentials, the same behaviour
    as SAML/MFA-bypass flaws such as CVE-2026-19868 in SSL-VPN appliances, where a
    stolen password is replayed through an authentication path that does not require
    the second factor.
author: threat-intel-sigma-agent
date: '2026/11/07'
references:
    - https://www.cisa.gov/known-exploited-vulnerabilities-catalog
tags:
    - attack.initial-access
    - attack.defense-evasion
    - attack.t1078
    - attack.t1562.010
logsource:
    category: idp
    product: authentik
detection:
    selection:
        authentik.action: login
    no_mfa_device:
        authentik.context.auth_method_args.mfa_devices.model_name: null
    condition: selection and no_mfa_device
falsepositives:
    - Flows or applications intentionally configured without an MFA stage
    - Service accounts using app passwords or API tokens
    - Passwordless WebAuthn logins (auth_method auth_webauthn_pwl) that record no separate MFA device
level: medium

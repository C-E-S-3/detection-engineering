title: Wazuh FIM Account Database Or Sudoers Changed
id: 2b8b3f67-fb9b-4ff7-8977-bce69631efd7
status: experimental
description: |
  Detects a Wazuh syscheck event for /etc/passwd, /etc/shadow, /etc/group,
  /etc/sudoers or /etc/sudoers.d. These alerts are the Wazuh sensor copy of
  account and privilege-file changes. Every hit is a real change to one of
  the files; whether it was expected is for the analyst (the alert carries
  no process or user). They are indexed on siem-wazuh-alerts,
  not on the auditd stream. The field is the alerts.json path syscheck.path.
references:
  - https://attack.mitre.org/techniques/T1136/001/
author: SecOps Engineer
date: '2026/11/07'
modified: '2026/11/20'
tags:
  - attack.persistence
  - attack.privilege_escalation
  - attack.t1136
  - attack.t1136.001
logsource:
  product: linux
  service: wazuh
detection:
  # Exact files, not prefixes: a prefix also matched the backup copies
  # (/etc/passwd-, /etc/shadow-, /etc/group-) that are rewritten together
  # with the real file and only repeat the alert.
  selection_file:
    syscheck.path:
      - /etc/passwd
      - /etc/shadow
      - /etc/group
      - /etc/sudoers
  selection_sudoers_dropin:
    syscheck.path|startswith: /etc/sudoers.d/
  condition: selection_file or selection_sudoers_dropin
falsepositives:
  - Package upgrades and configuration management that legitimately change these files
# medium, not high: every hit is a real change, but most are expected
# (configuration management creating accounts and sudoers drop-ins) and the
# alert has no process or user to tell them apart. Kept as a finding for
# review and correlation; the shell-write and account-tool rules carry the
# high-severity signal for the suspicious ways of making these changes.
level: medium

title: OS Command Injection Pattern In HTTP Request
id: 948caa84-7dd5-4aa6-a4b6-b8b7ce404dd6
status: experimental
description: |
  Detects command-substitution and shell-metacharacter payloads in the
  request path or query string: $(), backticks, encoded pipes and
  semicolons next to a shell command, and reads of /etc/passwd or
  /etc/shadow. Traefik v3 stores the raw query inside RequestPath (mapped
  to url.path), so a payload such as `%3B+id` is not the same string as
  `;id`. Encoded separators are listed with `+` and `%20` between the
  separator and the command. A bare pipe, semicolon or the words
  curl/wget/bash alone are not included; they show up in ordinary URLs.
references:
  - https://attack.mitre.org/techniques/T1190/
  - https://owasp.org/www-community/attacks/Command_Injection
author: detection-engineering
date: '2026/11/04'
tags:
  - attack.initial_access
  - attack.t1190
  - attack.execution
  - attack.t1059
logsource:
  product: traefik
  category: webserver
detection:
  selection:
    url.path|contains:
      - '$('
      - '%24%28'
      - '`id'
      - '`whoami'
      - '`uname'
      - '`cat'
      - ';cat '
      - '|cat '
      - ';id'
      - '|id'
      - ';+id'
      - '|+id'
      - '; id'
      - '| id'
      - ';wget'
      - '|wget'
      - ';curl'
      - '|curl'
      - '%3Bid'
      - '%3bid'
      - '%3B+id'
      - '%3b+id'
      - '%3B%20id'
      - '%3b%20id'
      - '%7Cid'
      - '%7cid'
      - '%7C+id'
      - '%7c+id'
      - '%7C%20id'
      - '%7c%20id'
      - '%3Bcat'
      - '%3bcat'
      - '%7Ccat'
      - '%7ccat'
      - '%3Bwget'
      - '%3bwget'
      - '%3Bcurl'
      - '%3bcurl'
      - 'bash -c'
      - 'sh -c'
      - '/etc/passwd'
      - '/etc/shadow'
      - '%2fetc%2fpasswd'
      - '%2Fetc%2Fpasswd'
      - '%2fetc%2fshadow'
      - '%2Fetc%2Fshadow'
  condition: selection
falsepositives:
  - Authorised vulnerability scanning
  - Documentation sites whose URLs contain one of these command snippets
level: high

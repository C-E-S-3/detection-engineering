title: Traefik Admin API Returned HTTP 200
id: 569bc163-fa29-4399-abec-dc9363d7a2e9
status: experimental
description: |
  Detects a Traefik admin or dashboard API request that the proxy answered
  with HTTP 200. That is a successful read of the dashboard or of router,
  service or entrypoint configuration, not just a probe. The same paths with
  any other status are covered by the access rule.
references:
  - https://doc.traefik.io/traefik/operations/api/
  - https://attack.mitre.org/techniques/T1190/
author: detection-engineering
date: '2026/11/04'
modified: '2026/11/25'
tags:
  - attack.initial_access
  - attack.t1190
  # Risk score: zero hits in 30 days; HTTP 200 from the admin API is a successful config read, short of 90 because an operator check is a known benign case.
  - risk.score.85
logsource:
  product: traefik
  category: webserver
detection:
  selection_path:
    url.path|startswith:
      - '/dashboard'
      - '/api/rawdata'
      - '/api/http/'
      - '/api/tcp/'
      - '/api/udp/'
      - '/api/entrypoints'
      - '/api/overview'
      - '/api/version'
  selection_status:
    http.response.status_code: 200
  # An application that serves its own UI or API under one of these prefixes
  # (/dashboard and /api/version are common). traefik.OriginStatus is the status
  # the routed backend returned (0 when no router matched), so OriginStatus 200
  # from a provider-defined backend is the application's own page. Traefik's API
  # and dashboard are served by api@internal / dashboard@internal and still alert.
  # The filter negates OriginStatus (present on every event), not ServiceName:
  # Security Analytics adds an _exists_ clause to a negated field.
  filter_backend_served:
    traefik.OriginStatus: 200
  selection_traefik_internal:
    traefik.ServiceName|endswith: '@internal'
  condition: selection_path and selection_status and (selection_traefik_internal or not filter_backend_served)
falsepositives:
  - An operator or health check intentionally reading an enabled Traefik API
level: critical

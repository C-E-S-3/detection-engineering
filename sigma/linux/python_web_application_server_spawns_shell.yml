title: Python Web Application Server Spawning A Unix Shell
id: c5492baf-85e8-43e8-8a82-22ed96d46eff
status: experimental
description: |
  Detects a Unix shell started directly by a Python web application server process
  (uvicorn, gunicorn, hypercorn, daphne, waitress, granian, Flask/Django development
  servers, MONAI Label). Python web services rarely shell out; a shell child is the usual
  footprint of remote code execution, e.g. the MONAI Label model-upload path traversal
  (CVE-2026-133968) where an uploaded archive is executed in the server process, as well as
  of deserialisation and template-injection bugs in Python web apps. Complements the
  existing PHP/web-server, Java and Node.js shell-spawn rules. The Python interpreter itself
  is the parent image, so the server is identified from the parent command line.
references:
  - https://www.cisa.gov/news-events/alerts/2026/11/24/cisa-adds-five-known-exploited-vulnerabilities-catalog
  - https://attack.mitre.org/techniques/T1190/
  - https://attack.mitre.org/techniques/T1059/004/
author: threat-intel-sigma-agent
date: '2026/11/25'
tags:
  - attack.initial_access
  - attack.t1190
  - attack.execution
  - attack.t1059.004
  - attack.persistence
  - attack.t1505.003
logsource:
  product: linux
  category: process_creation
detection:
  selection_parent_image:
    - ParentImage|contains: '/python'
    - ParentImage|endswith:
        - '/uvicorn'
        - '/gunicorn'
        - '/hypercorn'
        - '/daphne'
        - '/waitress-serve'
        - '/granian'
        - '/monailabel'
  selection_parent_cmd:
    ParentCommandLine|contains:
      - 'uvicorn'
      - 'gunicorn'
      - 'hypercorn'
      - 'daphne'
      - 'waitress'
      - 'granian'
      - 'monailabel'
      - 'manage.py runserver'
      - 'flask run'
  selection_child:
    Image|endswith:
      - '/sh'
      - '/bash'
      - '/dash'
      - '/zsh'
      - '/ksh'
      - '/busybox'
  condition: selection_parent_image and selection_parent_cmd and selection_child
falsepositives:
  - Python web applications that legitimately run shell commands (subprocess with
    shell=True), e.g. admin helpers, backup or conversion jobs triggered by the app
  - Development servers with auto-reload wrappers started from a shell script
level: high

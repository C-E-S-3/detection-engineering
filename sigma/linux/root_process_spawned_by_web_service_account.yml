title: Root Process Spawned By A Web Service Account Process
id: 344f251b-dfd8-435f-9216-7ce25c75e9db
status: experimental
description: |
  Detects a process running as root whose parent process runs as a typical web server
  service account (www-data, apache, nginx, http, lighttpd). A web worker cannot
  legitimately gain root except through setuid helpers, so this transition is the
  footprint of a local privilege escalation from a webshell, as in the CVE-2026-46300
  Linux kernel chain where PHP webshells were used to run commands as root.
references:
  - https://www.cisa.gov/news-events/alerts/2026/10/28/cisa-adds-two-known-exploited-vulnerabilities-catalog
  - https://attack.mitre.org/techniques/T1068/
author: threat-intel-sigma-agent
date: '2026/10/30'
tags:
  - attack.privilege_escalation
  - attack.t1068
  - attack.persistence
  - attack.t1505.003
  - attack.execution
  - attack.t1059.004
logsource:
  product: linux
  category: process_creation
detection:
  selection_parent_user:
    ParentUser:
      - 'www-data'
      - 'apache'
      - 'nginx'
      - 'http'
      - 'lighttpd'
  selection_root:
    # real UID of the new process; Sysmon's User name is not extracted as a field
    process.real_user.id: '0'
  condition: selection_parent_user and selection_root
falsepositives:
  - Unknown; sudo/pkexec themselves keep the caller's real UID and their children have a
    root parent, so legitimate privilege elevation does not match
level: high

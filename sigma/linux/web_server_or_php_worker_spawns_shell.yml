title: Web Server Or PHP Worker Spawning A Unix Shell
id: 26b6eb8a-97f9-4c75-8c0b-64ce16c186e1
status: experimental
description: |
  Detects a Unix shell started directly by a web server or PHP runtime process
  (Apache, nginx, PHP-FPM, mod_php, php-cgi, LiteSpeed, FrankenPHP). This is the most
  reliable post-exploitation signal for remote code execution in internet-facing web
  stacks, e.g. the PHP2Shell vulnerabilities (CVE-2026-109618 / CVE-2026-109619) where
  successful exploits still return HTTP 200, as well as for webshells in general.
references:
  - https://securitylabs.datadoghq.com/articles/php2shell-critical-vulnerabilities-in-php/
  - https://attack.mitre.org/techniques/T1505/003/
author: threat-intel-sigma-agent
date: '2026/10/24'
tags:
  - attack.initial_access
  - attack.t1190
  - attack.execution
  - attack.t1059.004
  - attack.persistence
  - attack.t1505.003
logsource:
  product: linux
  category: process_creation
detection:
  selection_parent:
    - ParentImage|endswith:
        - '/apache2'
        - '/httpd'
        - '/nginx'
        - '/lighttpd'
        - '/litespeed'
        - '/lsphp'
        - '/frankenphp'
        - '/php'
        - '/php-cgi'
    - ParentImage|contains:
        - '/php-fpm'
        - '/php5'
        - '/php7'
        - '/php8'
  selection_child:
    Image|endswith:
      - '/sh'
      - '/bash'
      - '/dash'
      - '/zsh'
      - '/ksh'
      - '/csh'
      - '/tcsh'
      - '/busybox'
  condition: selection_parent and selection_child
falsepositives:
  - PHP applications that legitimately shell out (exec/system/proc_open), e.g. image
    conversion, mail delivery via sendmail wrappers, CMS cron or update helpers
  - Web server init or log-rotation helpers started by the server binary
level: high

title: Search For Private Keys, Password Vaults Or Crypto Wallets Via Command Line
id: a709f2e1-9709-4bc0-915c-deeb1d163bf4
status: experimental
description: |
  Detects find/grep/locate style commands that search a host for private keys,
  password-manager databases or cryptocurrency wallet files. Attackers do this
  right after gaining a foothold (for example through a web shell) so they can
  harvest credentials and wallets. It was seen after CVE-2026-110447 exploitation
  of the Collabora Online built-in CODE server used to backdoor Nextcloud servers.
  Administrators rarely search the whole filesystem for these file types.
references:
  - https://thehackernews.com/2026/10/cisa-flags-two-actively-exploited.html
  - https://attack.mitre.org/techniques/T1552/004/
author: threat-intel-sigma-agent
date: '2026/10/26'
tags:
  - attack.credential_access
  - attack.t1552.001
  - attack.t1552.004
  - attack.t1555
  - attack.discovery
  - attack.t1083
  - attack.collection
  - attack.t1005
logsource:
  product: linux
  category: process_creation
detection:
  selection_tool:
    Image|endswith:
      - '/find'
      - '/grep'
      - '/egrep'
      - '/rg'
      - '/locate'
      - '/plocate'
      - '/mlocate'
      - '/fdfind'
  selection_target:
    CommandLine|contains:
      - 'wallet.dat'
      - '.kdbx'
      - 'id_rsa'
      - 'id_ed25519'
      - 'id_ecdsa'
      - 'PRIVATE KEY-----'
      - '.git-credentials'
      - 'logins.json'
      - 'key4.db'
      - '.bitcoin'
      - '.electrum'
      - 'Exodus'
      - 'MetaMask'
      - 'keystore/UTC--'
      - 'mnemonic'
      - 'seed phrase'
  condition: selection_tool and selection_target
falsepositives:
  - Administrators or audit scripts inventorying SSH keys
  - Secret-scanning tooling that greps for private-key headers in source trees
level: high

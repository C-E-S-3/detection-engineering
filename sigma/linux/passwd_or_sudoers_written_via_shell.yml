title: Passwd Or Sudoers Written Via Shell
id: 17a73e6e-97e9-4384-9d57-b05b3bdbc4a1
status: experimental
description: |
  Detects a shell or tee command line that writes /etc/passwd, /etc/shadow,
  /etc/group, or a sudoers file. Covers echo-append and sudoers.d drops that
  never call useradd. The command line must show the write itself: an output
  redirect into one of the files, tee, or sed -i. A command that only names
  one of the paths (reading it, testing it, a package script removing a
  conffile) does not match. A Wazuh syscheck modification of the same paths
  is a separate rule on the wazuh log type and also covers writes this rule
  cannot see (cp, mv, an editor).
references:
  - https://attack.mitre.org/techniques/T1136/001/
author: SecOps Engineer
date: '2026/11/07'
modified: '2026/11/20'
tags:
  - attack.persistence
  - attack.privilege_escalation
  - attack.t1136
  - attack.t1136.001
logsource:
  product: linux
  service: auditd
detection:
  selection_shell:
    process.exe|endswith:
      - /sh
      - /bash
      - /dash
      - /zsh
      - /busybox
      - /tee
  selection_target:
    process.command_line|contains:
      - /etc/passwd
      - /etc/shadow
      - /etc/group
      - /etc/sudoers
  # The write itself. Naming a path is not enough: Wazuh SCA checks, package
  # maintainer scripts (dpkg-maintscript-helper rm_conffile), container
  # entrypoints (`grep abc /etc/passwd`) and admin one-liners that read these
  # files were ~80% of this rule's hits. `> path` also covers `>> path`.
  selection_redirect:
    process.command_line|contains:
      - '> /etc/passwd'
      - '>/etc/passwd'
      - '> /etc/shadow'
      - '>/etc/shadow'
      - '> /etc/group'
      - '>/etc/group'
      - '> /etc/sudoers'
      - '>/etc/sudoers'
  selection_tee:
    process.exe|endswith: /tee
  selection_sed_inplace:
    process.command_line|contains: 'sed -i'
  condition: selection_shell and selection_target and (selection_redirect or selection_tee or selection_sed_inplace)
falsepositives:
  - An administrator or configuration management writing sudoers or passwd through a shell redirect
  - Package scripts that rewrite /etc/passwd with a redirect or sed -i
level: high

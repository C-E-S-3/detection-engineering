title: Search For Cloud Or LLM API Keys Via Command Line
id: c3af7017-2d0f-4b39-be05-f4635f537b84
status: experimental
description: |
  Detects find/grep style commands that hunt a Linux host for cloud provider credentials or
  LLM provider API keys - AWS credential files and secret-key variables, GCP application
  default credentials, OpenAI / Anthropic / Gemini / OpenRouter key variables or key
  prefixes, and dotenv files. LLMJacking crews (UNC6993) harvest exactly these secrets from
  servers, source trees and .env files, then resell the stolen model capacity at the victim's
  expense; infostealers and post-exploitation scripts run the same sweeps right after a
  foothold. Administrators rarely grep a system for secret-key material.
references:
  - https://cloud.google.com/blog/topics/threat-intelligence/llmjacking-monetizing-compromised-cloud-models
  - https://attack.mitre.org/techniques/T1552/001/
author: threat-intel-sigma-agent
date: '2026/11/04'
tags:
  - attack.credential_access
  - attack.t1552.001
  - attack.discovery
  - attack.t1083
  - attack.impact
  - attack.t1496
logsource:
  product: linux
  category: process_creation
detection:
  selection_tool:
    Image|endswith:
      - '/find'
      - '/grep'
      - '/egrep'
      - '/rg'
      - '/locate'
      - '/plocate'
      - '/fdfind'
  selection_target:
    CommandLine|contains:
      - 'aws_secret_access_key'
      - 'AWS_SECRET_ACCESS_KEY'
      - '.aws/credentials'
      - 'application_default_credentials.json'
      - 'OPENAI_API_KEY'
      - 'ANTHROPIC_API_KEY'
      - 'GEMINI_API_KEY'
      - 'OPENROUTER_API_KEY'
      - 'AZURE_OPENAI_API_KEY'
      - 'sk-ant-'
      - 'sk-proj-'
      - 'sk-or-v1-'
      - "-name .env"
      - "-name '.env"
      - '-name ".env'
      - "-name '*.env"
      - '-name "*.env'
  condition: selection_tool and selection_target
falsepositives:
  - Secret-scanning or compliance tooling that greps source trees for key patterns
  - Administrators locating their own .env files during troubleshooting
level: high

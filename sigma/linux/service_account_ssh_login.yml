title: Service Account Interactive SSH Login
id: 2fa038bb-27d6-4f9f-852b-fea85b7ea190
status: experimental
description: |
  Detects a successful auditd USER_LOGIN whose acct matches a service-account
  name. Those accounts are not supposed to open interactive SSH sessions.
  Matching acct requires the Vector auditd transform to parse msg='acct=...'
  out of USER_LOGIN. Prefixes are operational service names (svc_, service_,
  deploy_, ansible_, and named daemons), including svc_purpleteam. Short
  prefixes app_, bot_, and ci_ are omitted: they match human names, and this
  rule pages at high severity.
references:
  - https://attack.mitre.org/techniques/T1078/
author: SecOps Engineer
date: '2026/11/07'
tags:
  - attack.initial_access
  - attack.privilege_escalation
  - attack.t1078
logsource:
  product: linux
  service: auditd
detection:
  selection:
    type: USER_LOGIN
    auditd.res: success
  selection_ssh:
    terminal|contains: ssh
  selection_sshd:
    process.exe|endswith: /sshd
  selection_acct:
    acct|re: '^(svc_|service_|svc-|srv_|daemon_|deploy_|ansible_|wazuh|ossec|nagios|prometheus|grafana|redis|postgres|mysql|mongodb|elasticsearch|jenkins|gitlab|harbor|traefik)'
  condition: selection and selection_acct and (selection_ssh or selection_sshd)
falsepositives:
  - A service account that is intentionally used for interactive administration
  - A human account whose name starts with a kept prefix (svc_, deploy_, ansible_)
level: high

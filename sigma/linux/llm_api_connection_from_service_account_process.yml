title: LLM Provider API Connection From Web Or Database Service Account
id: 487a2e6c-ed86-490c-8bee-e4268430a020
status: experimental
description: |
  Detects an outbound network connection to a hosted LLM inference API (DeepSeek,
  Zhipu GLM / BigModel, Alibaba DashScope / Qwen, Moonshot/Kimi, SiliconFlow, OpenAI,
  Anthropic, Google Gemini, Mistral, Groq, Together, OpenRouter) made by a process
  running as a web-server, application-server or database service account
  (www-data, nginx, apache, tomcat, postgres, mysql, redis, nobody ...). These accounts
  serve requests and never need to call an LLM planner themselves. Autonomous
  AI-driven intrusion frameworks such as the weaponised Cairn framework used by
  CL-STA-1238 call DeepSeek or Zhipu GLM from the compromised host to plan their next
  step. After a web exploit, that agent runs with the privileges of the exploited
  worker, so an LLM API call from that account is a strong sign of an agent operating
  on the host. This complements the rule that keys on LLM API calls from binaries in
  writable directories: it catches agents run by an interpreter (python, node) that is
  installed in a normal system path.
references:
  - https://unit42.paloaltonetworks.com/cl-sta-1238-cairn-framework-autonomous-ai-attacks/
  - https://attack.mitre.org/techniques/T1071/001/
author: threat-intel-sigma-agent
date: '2026/11/15'
tags:
  - attack.command_and_control
  - attack.t1071.001
  - attack.t1104
  - attack.execution
  - attack.t1059
  - attack.initial_access
  - attack.t1190
logsource:
  product: linux
  category: network_connection
detection:
  selection_dest:
    - DestinationHostname:
        - 'api.deepseek.com'
        - 'open.bigmodel.cn'
        - 'api.zhipuai.cn'
        - 'dashscope.aliyuncs.com'
        - 'dashscope-intl.aliyuncs.com'
        - 'api.moonshot.cn'
        - 'api.moonshot.ai'
        - 'api.siliconflow.cn'
        - 'api.minimax.chat'
        - 'api.openai.com'
        - 'api.anthropic.com'
        - 'generativelanguage.googleapis.com'
        - 'api.mistral.ai'
        - 'api.groq.com'
        - 'api.together.xyz'
        - 'openrouter.ai'
    - DestinationHostname|endswith:
        - '.bigmodel.cn'
        - '.openrouter.ai'
  selection_user:
    User:
      - 'www-data'
      - 'nginx'
      - 'apache'
      - 'httpd'
      - 'http'
      - 'lighttpd'
      - 'caddy'
      - 'tomcat'
      - 'jetty'
      - 'nobody'
      - 'daemon'
      - 'postgres'
      - 'mysql'
      - 'mariadb'
      - 'redis'
      - 'mongodb'
      - 'elasticsearch'
      - 'opensearch'
  condition: selection_dest and selection_user
falsepositives:
  - A web application that legitimately calls an LLM API from its worker process (chatbot, summarisation or search feature); add an exception per host or application
  - Database extensions that call LLM APIs (e.g. pgai, vector-embedding plugins)
level: high

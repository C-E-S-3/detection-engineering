###############################################################################
# AI Agent — Threat Intel Scraper (GitHub Models)
#
# Automated threat intelligence collection agent. Scrapes threat intel
# sources, extracts IOCs/TTPs/threat actors via AI, and generates
# actionable Splunk searches — committed to repo on a schedule.
#
# Only writes a report when NEW IOCs AND NEW TTPs are discovered.
# Appends discovered IOCs to CSV files in the iocs/ directory.
#
# Uses GitHub Models with the built-in GITHUB_TOKEN. No API keys needed.
# Just add `models: read` to permissions.
#
# Prerequisites:
#   • GitHub Enterprise with Copilot, OR a repo with GitHub Models enabled
#   • Workflow permissions: Settings → Actions → General →
#       "Read and write permissions"
#   • iocs/ directory with domain.csv, hash.csv, and ip.csv files
#
# Available models: https://github.com/marketplace/models
###############################################################################

name: AI Agent — Threat Intel Scraper (GitHub Models)

on:
  # ── Webhook trigger ────────────────────────────────────────────────────
  repository_dispatch:
    types: [threat-intel-scrape]

  # ── Manual trigger for testing ─────────────────────────────────────────
  workflow_dispatch:
    inputs:
      target_url:
        description: 'URL to scrape (overrides default)'
        required: false
        type: string

permissions:
  contents: write
  models: read

concurrency:
  group: threat-intel-scrape
  cancel-in-progress: false

env:
  TARGET_URL: "https://www.cisa.gov/news-events/cybersecurity-advisories"

  # ── Model config ─────────────────────────────────────────────────────
  AI_MODEL: "openai/gpt-4o"

  # ── Endpoint config ──────────────────────────────────────────────────
  MODELS_ENDPOINT: "https://models.github.ai/inference/chat/completions"
  # MODELS_ENDPOINT: "https://models.github.ai/orgs/YOUR_ORG_NAME/inference/chat/completions"

jobs:
  scrape-and-extract:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # ── 1. Check out the repo ──────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Fetch the target website ────────────────────────────────────
      - name: Curl target website
        run: |
          URL="${{ github.event.client_payload.target_url || github.event.inputs.target_url || env.TARGET_URL }}"
          echo "Fetching: $URL"

          HTTP_CODE=$(curl -s -o /tmp/page_raw.html -w "%{http_code}" \
            -L --max-time 30 \
            -A "Mozilla/5.0 (GitHub Actions AI Agent)" \
            "$URL")

          echo "HTTP status: $HTTP_CODE"
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 400 ]; then
            echo "::error::Failed to fetch $URL (HTTP $HTTP_CODE)"
            exit 1
          fi

          # Strip HTML to plain text
          sed -e 's/<script[^>]*>.*<\/script>//gi' \
              -e 's/<style[^>]*>.*<\/style>//gi' \
              /tmp/page_raw.html \
            | sed -e 's/<[^>]*>//g' \
            | sed -e 's/&nbsp;/ /g; s/&amp;/\&/g; s/&lt;/</g; s/&gt;/>/g; s/&#x27;/'"'"'/g; s/&quot;/"/g' \
            | tr -s '[:space:]' '\n' \
            | sed '/^$/d' \
            > /tmp/page_text.txt

          head -c 20000 /tmp/page_text.txt > /tmp/page.html

          echo "$URL" > /tmp/source_url.txt

          TEXT_SIZE=$(wc -c < /tmp/page.html)
          echo "Stripped HTML to $TEXT_SIZE bytes of plain text"

          URL_SLUG=$(echo "$URL" \
            | sed 's|https\?://||' \
            | sed 's|[^a-zA-Z0-9]|-|g' \
            | sed 's|--*|-|g; s|^-||; s|-$||' \
            | cut -c1-80)
          DATESTAMP=$(date -u '+%Y-%m-%d')

          echo "$URL_SLUG" > /tmp/url_slug.txt
          echo "$DATESTAMP" > /tmp/datestamp.txt

      # ── 3. Build the API request payload ───────────────────────────────
      - name: Build API payload
        run: |
          # Copy existing IOC CSVs so the AI knows what's already tracked
          cp iocs/domain.csv /tmp/existing_domains.csv 2>/dev/null || echo "indicator,source,date_added,context" > /tmp/existing_domains.csv
          cp iocs/hash.csv   /tmp/existing_hashes.csv  2>/dev/null || echo "indicator,type,source,date_added,context" > /tmp/existing_hashes.csv
          cp iocs/ip.csv     /tmp/existing_ips.csv     2>/dev/null || echo "indicator,source,date_added,context" > /tmp/existing_ips.csv

          python3 << 'PYTHON_SCRIPT'
          import json

          with open("/tmp/source_url.txt") as f:
              source_url = f.read().strip()

          with open("/tmp/page.html") as f:
              page_content = f.read()

          with open("/tmp/existing_domains.csv") as f:
              existing_domains = f.read()

          with open("/tmp/existing_hashes.csv") as f:
              existing_hashes = f.read()

          with open("/tmp/existing_ips.csv") as f:
              existing_ips = f.read()

          system_prompt = """You are a senior threat intelligence analyst and detection engineer with deep expertise in MITRE ATT&CK, incident response, and Splunk.

          You will receive:
          1. Text scraped from a threat intel source
          2. Existing IOC CSV files from our tracking repo

          YOUR PRIMARY TASK: Determine if the source contains new IOCs OR new TTPs.

          CRITICAL RULES:
          - Produce a report if you find new IOCs, new TTPs, or both
          - ONLY skip the report if NEITHER new IOCs NOR new TTPs are found
          - MITRE ATT&CK mappings alone (without concrete IOCs or novel TTPs) are NOT sufficient — this is duplicate reference information
          - IOCs that already exist in the provided CSV files are NOT new
          - If the source only contains general MITRE framework descriptions, advisories without specific IOCs, or information we already track, DO NOT write a report

          RESPOND WITH VALID JSON ONLY — no markdown, no code fences, no preamble. Use this exact structure:

          {
            "has_new_intel": true or false,
            "skip_reason": "reason if has_new_intel is false, null otherwise",
            "severity": "critical | high | medium | low — based on exploitability, active exploitation, and impact (critical = actively exploited RCE/supply chain; high = weaponized exploit or APT campaign; medium = notable vulnerability or emerging threat; low = informational or limited scope)",
            "title": "short descriptive title for the threat (e.g., 'APT29 targets Exchange servers via CVE-2026-1234', 'Lazarus supply chain attack on npm packages'). Do NOT use generic titles like 'Threat Intelligence Report'.",
            "report": "full markdown threat intel report if has_new_intel is true, null otherwise",
            "new_iocs": {
              "domains": [
                {"indicator": "evil.example.com", "context": "C2 domain for FancyBear campaign"}
              ],
              "hashes": [
                {"indicator": "abc123...", "type": "SHA256", "context": "Backdoor dropper payload"}
              ],
              "ips": [
                {"indicator": "198.51.100.1", "context": "C2 server hosting malware payload"}
              ]
            }
          }

          WHEN has_new_intel IS TRUE, the "report" field must contain a full Markdown threat intel report with:

          ## 1. Indicators of Compromise (IOCs)
          ALL IOCs found, categorized: IP addresses, domains/URLs, file hashes (MD5/SHA1/SHA256), email addresses, file names/paths, registry keys, mutex names, C2 infrastructure.

          ## 2. TTPs (MITRE ATT&CK Mapping)
          Map techniques to MITRE ATT&CK: Tactic, Technique ID and name (e.g., T1566.001), description of usage.

          ## 3. Malware & Tools
          Malware families, LOLBins abused, custom tooling.

          ## 4. Threat Actor / Campaign Attribution
          Named threat groups (APT designations, aliases), campaign names, motivations, targeted sectors/geographies.

          ## 5. Splunk Detection Searches
          Ready-to-run SPL for each significant IOC or TTP:
          - Network IOCs: firewall, proxy, dns sourcetypes
          - Endpoint IOCs: Sysmon (XmlWinEventLog), CrowdStrike (crowdstrike:events:sensor), Windows Security logs
          - Hash lookups: endpoint detection sourcetypes
          - Behavioral TTPs: tstats or standard SPL correlation searches
          Format each in a fenced spl code block with a comment explaining what it detects.

          ## 6. Executive Summary
          3-5 sentence summary with urgency and recommended immediate actions.

          Start the report with YAML frontmatter: scraped_at (ISO 8601), source_url, report_type: threat-intel.

          REMEMBER: Respond with ONLY the JSON object. No other text."""

          user_prompt = (
              f"Analyze this threat intelligence source for NEW IOCs and TTPs "
              f"(source: {source_url}).\n\n"
              f"--- EXISTING TRACKED DOMAINS ---\n{existing_domains}\n\n"
              f"--- EXISTING TRACKED HASHES ---\n{existing_hashes}\n\n"
              f"--- EXISTING TRACKED IPs ---\n{existing_ips}\n\n"
              f"--- SOURCE CONTENT ---\n{page_content}"
          )

          payload = {
              "model": "${{ env.AI_MODEL }}",
              "messages": [
                  {"role": "system", "content": system_prompt},
                  {"role": "user", "content": user_prompt}
              ],
              "temperature": 0.2,
              "max_tokens": 4096
          }

          with open("/tmp/api_payload.json", "w") as f:
              json.dump(payload, f)

          print(f"Payload written ({len(user_prompt)} chars in user prompt)")
          PYTHON_SCRIPT

      # ── 4. Call GitHub Models API ──────────────────────────────────────
      - name: Call AI model
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Calling GitHub Models API (model: ${{ env.AI_MODEL }})..."

          curl -s -o /tmp/api_response.json -X POST \
            "${{ env.MODELS_ENDPOINT }}" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/json" \
            -d @/tmp/api_payload.json

          if ! jq empty /tmp/api_response.json 2>/dev/null; then
            echo "::error::API returned non-JSON response:"
            head -c 500 /tmp/api_response.json
            exit 1
          fi

          ERROR=$(jq -r '.error.message // empty' /tmp/api_response.json)
          if [ -n "$ERROR" ]; then
            echo "::error::GitHub Models API error: $ERROR"
            exit 1
          fi

          # Extract the AI response text
          jq -r '.choices[0].message.content // empty' /tmp/api_response.json > /tmp/ai_output.txt

          if [ ! -s /tmp/ai_output.txt ]; then
            echo "::error::Model returned empty content"
            jq -c '.choices' /tmp/api_response.json
            exit 1
          fi

          echo "AI response received ($(wc -c < /tmp/ai_output.txt) bytes)"

      # ── 5. Process AI response — write report & update IOC CSVs ────────
      - name: Process results
        id: process
        run: |
          python3 << 'PYTHON_SCRIPT'
          import json
          import csv
          import os
          from datetime import datetime, timezone

          with open("/tmp/ai_output.txt") as f:
              raw = f.read().strip()

          # Strip markdown code fences if the model wrapped its JSON
          if raw.startswith("```"):
              raw = raw.split("\n", 1)[1] if "\n" in raw else raw[3:]
          if raw.endswith("```"):
              raw = raw[:-3].strip()
          if raw.startswith("json"):
              raw = raw[4:].strip()

          try:
              data = json.loads(raw)
          except json.JSONDecodeError as e:
              print(f"::error::Failed to parse AI response as JSON: {e}")
              print(f"Raw output (first 500 chars): {raw[:500]}")
              # Write skip flag so commit step knows to bail
              with open("/tmp/skip_commit.txt", "w") as f:
                  f.write("true")
              exit(0)

          has_new_intel = data.get("has_new_intel", False)

          if not has_new_intel:
              reason = data.get("skip_reason", "No new IOCs and TTPs found")
              print(f"⏭️  Skipping report: {reason}")
              with open("/tmp/skip_commit.txt", "w") as f:
                  f.write("true")
              exit(0)

          print("✅ New intel found — writing report and updating IOCs")
          with open("/tmp/skip_commit.txt", "w") as f:
              f.write("false")

          now = datetime.now(timezone.utc).strftime("%Y-%m-%d")

          with open("/tmp/source_url.txt") as f:
              source_url = f.read().strip()

          with open("/tmp/url_slug.txt") as f:
              url_slug = f.read().strip()

          with open("/tmp/datestamp.txt") as f:
              datestamp = f.read().strip()

          # ── Extract severity and title metadata ────────────────────────
          severity = data.get("severity", "medium").lower()
          if severity not in ("critical", "high", "medium", "low"):
              severity = "medium"
          ai_title = data.get("title", "").strip()

          with open("/tmp/severity.txt", "w") as f:
              f.write(severity)
          with open("/tmp/ai_title.txt", "w") as f:
              f.write(ai_title)

          # ── Write the threat intel report ──────────────────────────────
          report = data.get("report", "")
          if report:
              output_dir = "threat-intel"
              os.makedirs(output_dir, exist_ok=True)
              output_path = f"{output_dir}/{datestamp}_{url_slug}.md"

              # Inject YAML frontmatter with severity metadata
              frontmatter = (
                  f"---\n"
                  f"scraped_at: \"{datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')}\"\n"
                  f"source_url: \"{source_url}\"\n"
                  f"report_type: threat-intel\n"
                  f"severity: \"{severity}\"\n"
                  f"title: \"{ai_title}\"\n"
                  f"---\n\n"
              )

              # If report already has frontmatter, replace it; otherwise prepend
              if report.lstrip().startswith("---"):
                  # Find closing --- and replace
                  parts = report.lstrip().split("---", 2)
                  if len(parts) >= 3:
                      report_body = parts[2]
                  else:
                      report_body = report
                  report_content = frontmatter + report_body.lstrip("\n")
              else:
                  report_content = frontmatter + report

              with open(output_path, "w") as f:
                  f.write(report_content)
              with open("/tmp/output_path.txt", "w") as f:
                  f.write(output_path)
              print(f"📄 Report written to {output_path} [severity: {severity}]")

          # ── Update IOC CSVs ────────────────────────────────────────────
          new_iocs = data.get("new_iocs", {})

          def append_iocs(csv_path, new_rows, fieldnames):
              """Append new IOCs to a CSV, skipping duplicates."""
              # Read existing indicators
              existing = set()
              if os.path.exists(csv_path):
                  with open(csv_path, "r") as f:
                      reader = csv.DictReader(f)
                      for row in reader:
                          existing.add(row.get("indicator", "").strip().lower())

              # Append only truly new ones
              added = 0
              with open(csv_path, "a", newline="") as f:
                  writer = csv.DictWriter(f, fieldnames=fieldnames)
                  # Write header if file is empty/new
                  if os.path.getsize(csv_path) == 0:
                      writer.writeheader()
                  for row in new_rows:
                      indicator = row.get("indicator", "").strip()
                      if indicator.lower() not in existing:
                          row_out = {fn: row.get(fn, "") for fn in fieldnames}
                          row_out["indicator"] = indicator
                          row_out["source"] = source_url
                          row_out["date_added"] = now
                          writer.writerow(row_out)
                          existing.add(indicator.lower())
                          added += 1
              return added

          # Domains
          domains = new_iocs.get("domains", [])
          if domains:
              n = append_iocs("iocs/domain.csv", domains,
                              ["indicator", "source", "date_added", "context"])
              print(f"🌐 Added {n} new domains to iocs/domain.csv")

          # Hashes
          hashes = new_iocs.get("hashes", [])
          if hashes:
              n = append_iocs("iocs/hash.csv", hashes,
                              ["indicator", "type", "source", "date_added", "context"])
              print(f"#️⃣  Added {n} new hashes to iocs/hash.csv")

          # IPs
          ips = new_iocs.get("ips", [])
          if ips:
              n = append_iocs("iocs/ip.csv", ips,
                              ["indicator", "source", "date_added", "context"])
              print(f"🔢 Added {n} new IPs to iocs/ip.csv")

          PYTHON_SCRIPT

      # ── 6. Commit and push ─────────────────────────────────────────────
      - name: Commit and push
        run: |
          SKIP=$(cat /tmp/skip_commit.txt 2>/dev/null || echo "true")
          if [ "$SKIP" = "true" ]; then
            echo "⏭️  No new intel — nothing to commit."
            exit 0
          fi

          SOURCE_URL=$(cat /tmp/source_url.txt)
          DATESTAMP=$(cat /tmp/datestamp.txt)
          OUTPUT_PATH=$(cat /tmp/output_path.txt 2>/dev/null || echo "")
          SEVERITY=$(cat /tmp/severity.txt 2>/dev/null || echo "medium")
          AI_TITLE=$(cat /tmp/ai_title.txt 2>/dev/null || echo "")

          git config user.name "ai-agent[bot]"
          git config user.email "ai-agent[bot]@users.noreply.github.com"

          # Stage both the report and any IOC CSV changes
          git add threat-intel/ iocs/

          if git diff --cached --quiet; then
            echo "No file changes — skipping commit."
          else
            # Use AI-generated title, fall back to heading extraction, then URL slug
            TITLE="${AI_TITLE}"
            if [ -z "$TITLE" ] && [ -n "$OUTPUT_PATH" ] && [ -f "$OUTPUT_PATH" ]; then
              TITLE=$(grep -m1 '^##\? ' "$OUTPUT_PATH" \
                | sed 's/^##\? //' \
                | cut -c1-72)
            fi
            TITLE="${TITLE:-$(cat /tmp/url_slug.txt)}"

            # Severity tag in uppercase for commit subject
            SEV_TAG=$(echo "$SEVERITY" | tr '[:lower:]' '[:upper:]')

            # Count IOC additions for commit body
            IOC_SUMMARY=""
            for csv in iocs/domain.csv iocs/hash.csv iocs/ip.csv; do
              if git diff --cached --name-only | grep -q "$csv"; then
                ADDED=$(git diff --cached "$csv" | grep '^+' | grep -v '^+++' | wc -l)
                TYPE=$(basename "$csv" .csv)
                IOC_SUMMARY="${IOC_SUMMARY}${TYPE}:${ADDED} "
              fi
            done

            COMMIT_MSG="threat-intel [${SEV_TAG}]: ${TITLE}"
            COMMIT_BODY="Source: ${SOURCE_URL}
          Date: ${DATESTAMP}
          Severity: ${SEVERITY}"
            if [ -n "$IOC_SUMMARY" ]; then
              COMMIT_BODY="${COMMIT_BODY}
          New IOCs: ${IOC_SUMMARY}"
            fi

            git commit -m "${COMMIT_MSG}" -m "${COMMIT_BODY}"

            git pull --rebase origin main
            git push
            echo "✅ Committed: ${COMMIT_MSG}"
          fi

###############################################################################
# AI Agent — Website Scraper (GitHub Models)
#
# Uses GitHub Models with the built-in GITHUB_TOKEN. No API keys needed.
# Just add `models: read` to permissions.
#
# Prerequisites:
#   • GitHub Enterprise with Copilot, OR a repo with GitHub Models enabled
#   • Workflow permissions: Settings → Actions → General →
#       "Read and write permissions"
#
# Available models: https://github.com/marketplace/models
###############################################################################

name: AI Agent — Website Scraper (GitHub Models)

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      target_url:
        description: 'URL to scrape (overrides default)'
        required: false
        type: string

permissions:
  contents: write
  models: read

env:
  TARGET_URL: "https://news.ycombinator.com"
  OUTPUT_FILE: "data/latest_scrape.md"
  AI_MODEL: "openai/gpt-4.1"

jobs:
  scrape-and-extract:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # ── 1. Check out the repo ──────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Fetch the target website ────────────────────────────────────
      - name: Curl target website
        run: |
          URL="${{ github.event.inputs.target_url || env.TARGET_URL }}"
          echo "Fetching: $URL"

          HTTP_CODE=$(curl -s -o /tmp/page_raw.html -w "%{http_code}" \
            -L --max-time 30 \
            -A "Mozilla/5.0 (GitHub Actions AI Agent)" \
            "$URL")

          echo "HTTP status: $HTTP_CODE"
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 400 ]; then
            echo "::error::Failed to fetch $URL (HTTP $HTTP_CODE)"
            exit 1
          fi

          # Strip HTML to plain text: remove scripts, styles, tags, then
          # collapse whitespace. This shrinks a typical page from ~60KB
          # of HTML to ~5-10KB of readable text — well under token limits.
          sed -e 's/<script[^>]*>.*<\/script>//gi' \
              -e 's/<style[^>]*>.*<\/style>//gi' \
              /tmp/page_raw.html \
            | sed -e 's/<[^>]*>//g' \
            | sed -e 's/&nbsp;/ /g; s/&amp;/\&/g; s/&lt;/</g; s/&gt;/>/g; s/&#x27;/'"'"'/g; s/&quot;/"/g' \
            | tr -s '[:space:]' '\n' \
            | sed '/^$/d' \
            > /tmp/page_text.txt

          # Hard cap at ~20KB of text (~5000 tokens, leaving room for
          # the system prompt within the 8000 token limit)
          head -c 20000 /tmp/page_text.txt > /tmp/page.html

          # Store the URL for later
          echo "$URL" > /tmp/source_url.txt

          TEXT_SIZE=$(wc -c < /tmp/page.html)
          echo "Stripped HTML to $TEXT_SIZE bytes of plain text"

      # ── 3. Call GitHub Models API ──────────────────────────────────────
      #
      #  We use the REST API directly instead of actions/ai-inference
      #  because the ai-inference action requires passing content as a
      #  `with:` input, which can't safely handle large HTML blobs.
      #
      #  Auth is still just GITHUB_TOKEN — no secrets to configure.
      #
      - name: Extract data with AI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SOURCE_URL=$(cat /tmp/source_url.txt)

          SYSTEM_PROMPT="You are a data extraction agent. Analyze the provided text (stripped from a web page) and extract:
          1. The page title
          2. The top 10 story headlines with their URLs and point counts
          3. A brief summary of trending topics

          Format your response as clean Markdown. Start with a YAML frontmatter
          block containing scraped_at (ISO 8601 timestamp) and source_url.
          Then provide the extracted data under clear headings.
          Respond ONLY with the Markdown content — no preamble, no code fences."

          # Build JSON payload with jq — it handles all escaping of the
          # HTML content safely (no heredoc/delimiter issues)
          PAYLOAD=$(jq -n \
            --arg model "${{ env.AI_MODEL }}" \
            --arg system "$SYSTEM_PROMPT" \
            --arg user "$(printf 'Extract information from this web page text (source: %s):\n\n%s' "$SOURCE_URL" "$(cat /tmp/page.html)")" \
            '{
              model: $model,
              messages: [
                { role: "system", content: $system },
                { role: "user",   content: $user }
              ],
              temperature: 0.2,
              max_tokens: 4096
            }')

          echo "Calling GitHub Models API (model: ${{ env.AI_MODEL }})..."

          RESPONSE=$(curl -s -X POST \
            "https://models.github.ai/inference/chat/completions" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          # Check for errors
          ERROR=$(echo "$RESPONSE" | jq -r '.error.message // empty')
          if [ -n "$ERROR" ]; then
            echo "::error::GitHub Models API error: $ERROR"
            exit 1
          fi

          # Extract the response text
          EXTRACTED=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // empty')

          if [ -z "$EXTRACTED" ]; then
            echo "::error::Model returned empty content"
            echo "Response: $(echo "$RESPONSE" | jq -c '.choices')"
            exit 1
          fi

          # Write to output file
          mkdir -p "$(dirname "${{ env.OUTPUT_FILE }}")"
          echo "$EXTRACTED" > "${{ env.OUTPUT_FILE }}"
          echo "✅ Wrote $(wc -l < "${{ env.OUTPUT_FILE }}") lines to ${{ env.OUTPUT_FILE }}"

      # ── 4. Commit and push ─────────────────────────────────────────────
      - name: Commit and push
        run: |
          git config user.name "ai-agent[bot]"
          git config user.email "ai-agent[bot]@users.noreply.github.com"
          git add "${{ env.OUTPUT_FILE }}"

          if git diff --cached --quiet; then
            echo "No changes — skipping commit."
          else
            TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M UTC')
            git commit -m "chore(ai-agent): scrape update $TIMESTAMP"
            git push
            echo "✅ Committed and pushed."
          fi

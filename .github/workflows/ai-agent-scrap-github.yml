###############################################################################
# AI Agent — Threat Intel Scraper (GitHub Models)
#
# Automated threat intelligence collection agent. Scrapes threat intel
# sources, extracts IOCs/TTPs/threat actors via AI, and generates
# actionable Splunk searches — committed to repo on a schedule.
#
# Uses GitHub Models with the built-in GITHUB_TOKEN. No API keys needed.
# Just add `models: read` to permissions.
#
# Prerequisites:
#   • GitHub Enterprise with Copilot, OR a repo with GitHub Models enabled
#   • Workflow permissions: Settings → Actions → General →
#       "Read and write permissions"
#
# Available models: https://github.com/marketplace/models
###############################################################################

name: AI Agent — Threat Intel Scraper (GitHub Models)

on:
  # ── Webhook trigger ────────────────────────────────────────────────────
  # Fires when GitHub receives a webhook payload at:
  #   POST https://api.github.com/repos/OWNER/REPO/dispatches
  #
  # Trigger it with:
  #   curl -X POST \
  #     -H "Authorization: Bearer YOUR_PAT" \
  #     -H "Accept: application/vnd.github+json" \
  #     https://api.github.com/repos/OWNER/REPO/dispatches \
  #     -d '{"event_type":"threat-intel-scrape","client_payload":{"target_url":"https://example.com/advisory"}}'
  #
  repository_dispatch:
    types: [threat-intel-scrape]

  # ── Manual trigger for testing ─────────────────────────────────────────
  workflow_dispatch:
    inputs:
      target_url:
        description: 'URL to scrape (overrides default)'
        required: false
        type: string

permissions:
  contents: write
  models: read

env:
  TARGET_URL: "https://www.cisa.gov/news-events/cybersecurity-advisories"

  # ── Model config ─────────────────────────────────────────────────────
  # Pick a model available in your Enterprise org. Common options:
  #   openai/gpt-4o        ← broadest Enterprise availability (recommended)
  #   openai/gpt-4o-mini   ← faster/cheaper, smaller context
  #   openai/gpt-4.1       ← newer, but may not be approved in your org yet
  #   openai/gpt-4.1-mini  ← newer mini variant
  #
  # To see what's available, ask your GitHub admin or call:
  #   GET https://models.github.ai/catalog/models
  #
  AI_MODEL: "openai/gpt-4.1"

  # ── Endpoint config ──────────────────────────────────────────────────
  # Enterprise orgs may need the org-scoped endpoint:
  #   https://models.github.ai/orgs/YOUR_ORG/inference/chat/completions
  #
  # Public (works for personal repos & some Enterprise setups):
  #   https://models.github.ai/inference/chat/completions
  #
  # Uncomment the one that works for you:
  MODELS_ENDPOINT: "https://models.github.ai/inference/chat/completions"
  # MODELS_ENDPOINT: "https://models.github.ai/orgs/YOUR_ORG_NAME/inference/chat/completions"

jobs:
  scrape-and-extract:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # ── 1. Check out the repo ──────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Fetch the target website ────────────────────────────────────
      - name: Curl target website
        run: |
          URL="${{ github.event.client_payload.target_url || github.event.inputs.target_url || env.TARGET_URL }}"
          echo "Fetching: $URL"

          HTTP_CODE=$(curl -s -o /tmp/page_raw.html -w "%{http_code}" \
            -L --max-time 30 \
            -A "Mozilla/5.0 (GitHub Actions AI Agent)" \
            "$URL")

          echo "HTTP status: $HTTP_CODE"
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 400 ]; then
            echo "::error::Failed to fetch $URL (HTTP $HTTP_CODE)"
            exit 1
          fi

          # Strip HTML to plain text: remove scripts, styles, tags, then
          # collapse whitespace. This shrinks a typical page from ~60KB
          # of HTML to ~5-10KB of readable text — well under token limits.
          sed -e 's/<script[^>]*>.*<\/script>//gi' \
              -e 's/<style[^>]*>.*<\/style>//gi' \
              /tmp/page_raw.html \
            | sed -e 's/<[^>]*>//g' \
            | sed -e 's/&nbsp;/ /g; s/&amp;/\&/g; s/&lt;/</g; s/&gt;/>/g; s/&#x27;/'"'"'/g; s/&quot;/"/g' \
            | tr -s '[:space:]' '\n' \
            | sed '/^$/d' \
            > /tmp/page_text.txt

          # Hard cap at ~20KB of text (~5000 tokens, leaving room for
          # the system prompt within the 8000 token limit)
          head -c 20000 /tmp/page_text.txt > /tmp/page.html

          # Store the URL for later
          echo "$URL" > /tmp/source_url.txt

          TEXT_SIZE=$(wc -c < /tmp/page.html)
          echo "Stripped HTML to $TEXT_SIZE bytes of plain text"

          # Generate a filename slug from the URL path
          # e.g. https://cisa.gov/news/aa25-001 → cisa-gov-news-aa25-001
          URL_SLUG=$(echo "$URL" \
            | sed 's|https\?://||' \
            | sed 's|[^a-zA-Z0-9]|-|g' \
            | sed 's|--*|-|g; s|^-||; s|-$||' \
            | cut -c1-80)
          DATESTAMP=$(date -u '+%Y-%m-%d')

          echo "$URL_SLUG" > /tmp/url_slug.txt
          echo "$DATESTAMP" > /tmp/datestamp.txt

      # ── 3. Call GitHub Models API & write report ───────────────────────
      #
      #  We use the REST API directly instead of actions/ai-inference
      #  because the ai-inference action requires passing content as a
      #  `with:` input, which can't safely handle large text blobs.
      #
      #  Auth is still just GITHUB_TOKEN — no secrets to configure.
      #
      #  IMPORTANT: The file write MUST happen in this same step because
      #  shell variables (like $EXTRACTED) don't cross step boundaries
      #  in GitHub Actions.
      #
      - name: Extract data with AI and write report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SOURCE_URL=$(cat /tmp/source_url.txt)
          URL_SLUG=$(cat /tmp/url_slug.txt)
          DATESTAMP=$(cat /tmp/datestamp.txt)

          SYSTEM_PROMPT="You are a senior threat intelligence analyst and detection engineer with deep expertise in MITRE ATT&CK, incident response, and Splunk. Analyze the provided text (scraped from a threat intel source) and produce a structured threat intelligence report.

          Extract and organize the following:

          ## 1. Indicators of Compromise (IOCs)
          Extract ALL IOCs found, categorized by type:
          - IP addresses (IPv4/IPv6)
          - Domains and URLs
          - File hashes (MD5, SHA1, SHA256)
          - Email addresses used in campaigns
          - File names and paths
          - Registry keys
          - Mutex names
          - C2 infrastructure details

          ## 2. TTPs (MITRE ATT&CK Mapping)
          Map observed techniques to MITRE ATT&CK framework:
          - Tactic (e.g., Initial Access, Execution, Persistence)
          - Technique ID and name (e.g., T1566.001 - Spearphishing Attachment)
          - Brief description of how the technique was used

          ## 3. Malware & Tools
          - Malware families/names mentioned
          - Legitimate tools abused (LOLBins, etc.)
          - Custom tooling descriptions

          ## 4. Threat Actor / Campaign Attribution
          - Named threat groups (APT designations, aliases)
          - Campaign names
          - Known affiliations or motivations (espionage, financial, hacktivism)
          - Targeted sectors and geographies

          ## 5. Splunk Detection Searches
          For each significant IOC or TTP, provide a ready-to-run Splunk search.
          Tailor searches to common sourcetypes and index patterns:
          - Network IOCs: use firewall, proxy, dns sourcetypes
          - Endpoint IOCs: use Sysmon (XmlWinEventLog), CrowdStrike (crowdstrike:events:sensor), or Windows Security logs
          - Hash lookups: search across endpoint detection sourcetypes
          - Behavioral TTPs: write correlation searches using tstats or standard SPL

          Format each search in a fenced code block with language 'spl'. Include a
          brief comment explaining what the search detects.

          ## 6. Executive Summary
          Provide a 3-5 sentence summary of the threat landscape described in the
          source, highlighting urgency and recommended immediate actions.

          Format the full response as clean Markdown. Start with a YAML frontmatter
          block containing: scraped_at (ISO 8601), source_url, and report_type: threat-intel.
          If no threat intelligence content is found in the text, state that clearly
          and note what type of content was found instead.
          Respond ONLY with the Markdown content — no preamble, no code fences around the entire response."

                   # Build the user prompt as a file first to avoid any shell
          # interpolation issues with special characters in URLs or HTML
          printf 'Analyze this threat intelligence source for IOCs, TTPs, malware, and threat actors (source: %s):\n\n' "$SOURCE_URL" > /tmp/user_prompt.txt
          cat /tmp/page.html >> /tmp/user_prompt.txt

          # Build JSON payload using --rawfile so jq reads the file
          # directly — no shell expansion, no subshell, no parse errors
          PAYLOAD=$(jq -n \
            --arg model "${{ env.AI_MODEL }}" \
            --arg system "$SYSTEM_PROMPT" \
            --rawfile user /tmp/user_prompt.txt \
            '{
              model: $model,
              messages: [
                { role: "system", content: $system },
                { role: "user",   content: $user }
              ],
              temperature: 0.2,
              max_tokens: 4096
            }')


          echo "Calling GitHub Models API (model: ${{ env.AI_MODEL }})..."
          echo "Endpoint: ${{ env.MODELS_ENDPOINT }}"

          RESPONSE=$(curl -s -X POST \
            "${{ env.MODELS_ENDPOINT }}" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          # Check for errors
          ERROR=$(echo "$RESPONSE" | jq -r '.error.message // empty')
          if [ -n "$ERROR" ]; then
            echo "::error::GitHub Models API error: $ERROR"
            exit 1
          fi

          # Extract the response text
          EXTRACTED=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // empty')

          if [ -z "$EXTRACTED" ]; then
            echo "::error::Model returned empty content"
            echo "Response: $(echo "$RESPONSE" | jq -c '.choices')"
            exit 1
          fi

          # Write to uniquely-named output file (MUST be in this step
          # because $EXTRACTED only exists in this shell process)
          OUTPUT_DIR="threat-intel"
          OUTPUT_PATH="${OUTPUT_DIR}/${DATESTAMP}_${URL_SLUG}.md"

          mkdir -p "$OUTPUT_DIR"
          echo "$EXTRACTED" > "$OUTPUT_PATH"
          echo "$OUTPUT_PATH" > /tmp/output_path.txt
          echo "✅ Wrote $(wc -l < "$OUTPUT_PATH") lines to $OUTPUT_PATH"

      # ── 4. Commit and push ─────────────────────────────────────────────
      - name: Commit and push
        run: |
          SOURCE_URL=$(cat /tmp/source_url.txt)
          DATESTAMP=$(cat /tmp/datestamp.txt)
          OUTPUT_PATH=$(cat /tmp/output_path.txt)

          git config user.name "ai-agent[bot]"
          git config user.email "ai-agent[bot]@users.noreply.github.com"
          git add threat-intel/

          if git diff --cached --quiet; then
            echo "No changes — skipping commit."
          else
            # Extract a title from the first H1/H2 in the markdown,
            # or fall back to the URL slug
            TITLE=$(grep -m1 '^##\? ' "$OUTPUT_PATH" \
              | sed 's/^##\? //' \
              | cut -c1-72)
            TITLE="${TITLE:-$(cat /tmp/url_slug.txt)}"

            git commit -m "threat-intel: ${TITLE}" \
              -m "Source: ${SOURCE_URL}" \
              -m "Date: ${DATESTAMP}"
            git push
            echo "✅ Committed: threat-intel: ${TITLE}"
          fi

###############################################################################
# AI Agent — Threat Intel Scraper (GitHub Models)
#
# Automated threat intelligence collection agent. Scrapes threat intel
# sources, extracts IOCs/TTPs/threat actors via AI, and generates
# actionable Splunk searches — committed to repo on a schedule.
#
# Uses GitHub Models with the built-in GITHUB_TOKEN. No API keys needed.
# Just add `models: read` to permissions.
#
# Prerequisites:
#   • GitHub Enterprise with Copilot, OR a repo with GitHub Models enabled
#   • Workflow permissions: Settings → Actions → General →
#       "Read and write permissions"
#
# Available models: https://github.com/marketplace/models
###############################################################################

name: AI Agent — Threat Intel Scraper (GitHub Models)

on:
  # ── Webhook trigger ────────────────────────────────────────────────────
  # Fires when GitHub receives a webhook payload at:
  #   POST https://api.github.com/repos/OWNER/REPO/dispatches
  #
  # Trigger it with:
  #   curl -X POST \
  #     -H "Authorization: Bearer YOUR_PAT" \
  #     -H "Accept: application/vnd.github+json" \
  #     https://api.github.com/repos/OWNER/REPO/dispatches \
  #     -d '{"event_type":"threat-intel-scrape","client_payload":{"target_url":"https://example.com/advisory"}}'
  #
  repository_dispatch:
    types: [threat-intel-scrape]

  # ── Manual trigger for testing ─────────────────────────────────────────
  workflow_dispatch:
    inputs:
      target_url:
        description: 'URL to scrape (overrides default)'
        required: false
        type: string

permissions:
  contents: write
  models: read

env:
  TARGET_URL: "https://www.cisa.gov/news-events/cybersecurity-advisories"

  # ── Model config ─────────────────────────────────────────────────────
  # Pick a model available in your Enterprise org. Common options:
  #   openai/gpt-4o        ← broadest Enterprise availability (recommended)
  #   openai/gpt-4o-mini   ← faster/cheaper, smaller context
  #   openai/gpt-4.1       ← newer, but may not be approved in your org yet
  #   openai/gpt-4.1-mini  ← newer mini variant
  #
  # To see what's available, ask your GitHub admin or call:
  #   GET https://models.github.ai/catalog/models
  #
  AI_MODEL: "openai/gpt-4o"

  # ── Endpoint config ──────────────────────────────────────────────────
  # Enterprise orgs may need the org-scoped endpoint:
  #   https://models.github.ai/orgs/YOUR_ORG/inference/chat/completions
  #
  # Public (works for personal repos & some Enterprise setups):
  #   https://models.github.ai/inference/chat/completions
  #
  MODELS_ENDPOINT: "https://models.github.ai/inference/chat/completions"
  # MODELS_ENDPOINT: "https://models.github.ai/orgs/YOUR_ORG_NAME/inference/chat/completions"

jobs:
  scrape-and-extract:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # ── 1. Check out the repo ──────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Fetch the target website ────────────────────────────────────
      - name: Curl target website
        run: |
          URL="${{ github.event.client_payload.target_url || github.event.inputs.target_url || env.TARGET_URL }}"
          echo "Fetching: $URL"

          HTTP_CODE=$(curl -s -o /tmp/page_raw.html -w "%{http_code}" \
            -L --max-time 30 \
            -A "Mozilla/5.0 (GitHub Actions AI Agent)" \
            "$URL")

          echo "HTTP status: $HTTP_CODE"
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 400 ]; then
            echo "::error::Failed to fetch $URL (HTTP $HTTP_CODE)"
            exit 1
          fi

          # Strip HTML to plain text
          sed -e 's/<script[^>]*>.*<\/script>//gi' \
              -e 's/<style[^>]*>.*<\/style>//gi' \
              /tmp/page_raw.html \
            | sed -e 's/<[^>]*>//g' \
            | sed -e 's/&nbsp;/ /g; s/&amp;/\&/g; s/&lt;/</g; s/&gt;/>/g; s/&#x27;/'"'"'/g; s/&quot;/"/g' \
            | tr -s '[:space:]' '\n' \
            | sed '/^$/d' \
            > /tmp/page_text.txt

          # Hard cap at ~20KB (~5000 tokens)
          head -c 20000 /tmp/page_text.txt > /tmp/page.html

          # Store metadata in files
          echo "$URL" > /tmp/source_url.txt

          TEXT_SIZE=$(wc -c < /tmp/page.html)
          echo "Stripped HTML to $TEXT_SIZE bytes of plain text"

          # Generate filename slug
          URL_SLUG=$(echo "$URL" \
            | sed 's|https\?://||' \
            | sed 's|[^a-zA-Z0-9]|-|g' \
            | sed 's|--*|-|g; s|^-||; s|-$||' \
            | cut -c1-80)
          DATESTAMP=$(date -u '+%Y-%m-%d')

          echo "$URL_SLUG" > /tmp/url_slug.txt
          echo "$DATESTAMP" > /tmp/datestamp.txt

      # ── 3. Build the API request payload ───────────────────────────────
      #
      #  Uses Python to build the JSON payload. This completely eliminates
      #  shell quoting/interpolation issues — Python's json.dumps handles
      #  all escaping correctly no matter what characters are in the
      #  scraped text or webhook URL (ampersands, quotes, backticks, etc.)
      #
      - name: Build API payload
        run: |
          python3 << 'PYTHON_SCRIPT'
          import json

          with open("/tmp/source_url.txt") as f:
              source_url = f.read().strip()

          with open("/tmp/page.html") as f:
              page_content = f.read()

          system_prompt = (
              "You are a senior threat intelligence analyst and detection engineer "
              "with deep expertise in MITRE ATT&CK, incident response, and Splunk. "
              "Analyze the provided text (scraped from a threat intel source) and "
              "produce a structured threat intelligence report.\n\n"
              "Extract and organize the following:\n\n"
              "## 1. Indicators of Compromise (IOCs)\n"
              "Extract ALL IOCs found, categorized by type:\n"
              "- IP addresses (IPv4/IPv6)\n"
              "- Domains and URLs\n"
              "- File hashes (MD5, SHA1, SHA256)\n"
              "- Email addresses used in campaigns\n"
              "- File names and paths\n"
              "- Registry keys\n"
              "- Mutex names\n"
              "- C2 infrastructure details\n\n"
              "## 2. TTPs (MITRE ATT&CK Mapping)\n"
              "Map observed techniques to MITRE ATT&CK framework:\n"
              "- Tactic (e.g., Initial Access, Execution, Persistence)\n"
              "- Technique ID and name (e.g., T1566.001 - Spearphishing Attachment)\n"
              "- Brief description of how the technique was used\n\n"
              "## 3. Malware & Tools\n"
              "- Malware families/names mentioned\n"
              "- Legitimate tools abused (LOLBins, etc.)\n"
              "- Custom tooling descriptions\n\n"
              "## 4. Threat Actor / Campaign Attribution\n"
              "- Named threat groups (APT designations, aliases)\n"
              "- Campaign names\n"
              "- Known affiliations or motivations (espionage, financial, hacktivism)\n"
              "- Targeted sectors and geographies\n\n"
              "## 5. Splunk Detection Searches\n"
              "For each significant IOC or TTP, provide a ready-to-run Splunk search.\n"
              "Tailor searches to common sourcetypes and index patterns:\n"
              "- Network IOCs: use firewall, proxy, dns sourcetypes\n"
              "- Endpoint IOCs: use Sysmon (XmlWinEventLog), CrowdStrike "
              "(crowdstrike:events:sensor), or Windows Security logs\n"
              "- Hash lookups: search across endpoint detection sourcetypes\n"
              "- Behavioral TTPs: write correlation searches using tstats or standard SPL\n\n"
              "Format each search in a fenced code block with language 'spl'. Include a "
              "brief comment explaining what the search detects.\n\n"
              "## 6. Executive Summary\n"
              "Provide a 3-5 sentence summary of the threat landscape described in the "
              "source, highlighting urgency and recommended immediate actions.\n\n"
              "Format the full response as clean Markdown. Start with a YAML frontmatter "
              "block containing: scraped_at (ISO 8601), source_url, and report_type: threat-intel.\n"
              "If no threat intelligence content is found in the text, state that clearly "
              "and note what type of content was found instead.\n"
              "Respond ONLY with the Markdown content - no preamble, no code fences around "
              "the entire response."
          )

          user_prompt = (
              f"Analyze this threat intelligence source for IOCs, TTPs, malware, "
              f"and threat actors (source: {source_url}):\n\n{page_content}"
          )

          payload = {
              "model": "${{ env.AI_MODEL }}",
              "messages": [
                  {"role": "system", "content": system_prompt},
                  {"role": "user", "content": user_prompt}
              ],
              "temperature": 0.2,
              "max_tokens": 4096
          }

          with open("/tmp/api_payload.json", "w") as f:
              json.dump(payload, f)

          print(f"Payload written ({len(user_prompt)} chars in user prompt)")
          PYTHON_SCRIPT

      # ── 4. Call GitHub Models API & write report ───────────────────────
      #
      #  Sends the pre-built JSON file with -d @file — no shell
      #  interpolation touches the payload at all.
      #  Writes response to a file and parses with jq from the file.
      #
      - name: Call AI and write report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          URL_SLUG=$(cat /tmp/url_slug.txt)
          DATESTAMP=$(cat /tmp/datestamp.txt)
          SOURCE_URL=$(cat /tmp/source_url.txt)

          echo "Calling GitHub Models API (model: ${{ env.AI_MODEL }})..."
          echo "Endpoint: ${{ env.MODELS_ENDPOINT }}"

          # Send pre-built JSON file — curl reads it directly, no shell in the middle
          curl -s -o /tmp/api_response.json -X POST \
            "${{ env.MODELS_ENDPOINT }}" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/json" \
            -d @/tmp/api_payload.json

          # Verify we got valid JSON back (not an HTML error page)
          if ! jq empty /tmp/api_response.json 2>/dev/null; then
            echo "::error::API returned non-JSON response:"
            echo "--- First 500 chars ---"
            head -c 500 /tmp/api_response.json
            echo ""
            exit 1
          fi

          # Check for API errors
          ERROR=$(jq -r '.error.message // empty' /tmp/api_response.json)
          if [ -n "$ERROR" ]; then
            echo "::error::GitHub Models API error: $ERROR"
            exit 1
          fi

          # Extract the response text
          EXTRACTED=$(jq -r '.choices[0].message.content // empty' /tmp/api_response.json)

          if [ -z "$EXTRACTED" ]; then
            echo "::error::Model returned empty content"
            jq -c '.choices' /tmp/api_response.json
            exit 1
          fi

          # Write to uniquely-named output file
          OUTPUT_DIR="threat-intel"
          OUTPUT_PATH="${OUTPUT_DIR}/${DATESTAMP}_${URL_SLUG}.md"

          mkdir -p "$OUTPUT_DIR"
          echo "$EXTRACTED" > "$OUTPUT_PATH"
          echo "$OUTPUT_PATH" > /tmp/output_path.txt
          echo "Wrote $(wc -l < "$OUTPUT_PATH") lines to $OUTPUT_PATH"

      # ── 5. Commit and push ─────────────────────────────────────────────
      - name: Commit and push
        run: |
          SOURCE_URL=$(cat /tmp/source_url.txt)
          DATESTAMP=$(cat /tmp/datestamp.txt)
          OUTPUT_PATH=$(cat /tmp/output_path.txt)

          git config user.name "ai-agent[bot]"
          git config user.email "ai-agent[bot]@users.noreply.github.com"
          git add threat-intel/

          if git diff --cached --quiet; then
            echo "No changes — skipping commit."
          else
            TITLE=$(grep -m1 '^##\? ' "$OUTPUT_PATH" \
              | sed 's/^##\? //' \
              | cut -c1-72)
            TITLE="${TITLE:-$(cat /tmp/url_slug.txt)}"

            git commit -m "threat-intel: ${TITLE}" \
              -m "Source: ${SOURCE_URL}" \
              -m "Date: ${DATESTAMP}"
            git push
            echo "Committed: threat-intel: ${TITLE}"
          fi

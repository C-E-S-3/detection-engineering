---
# Push custom detection rules and decoders from this repo to the Wazuh manager.
#
# Uploads all XML files from wazuh/rules/ and wazuh/decoders/ to the Wazuh
# manager REST API at 10.0.69.7:55000. Reloads the manager after any change.
# Idempotent — skips files whose content matches what is already on the manager.
#
# Rule/decoder source (relative to repo root):
#   wazuh/rules/*.xml    — custom detection rules
#   wazuh/decoders/*.xml — custom decoders
#
# Prerequisites (one of):
#   A) WAZUH_API_USER + WAZUH_API_PASSWORD set in Semaphore env shell vars (preferred)
#   B) OPENBAO_TOKEN set in Semaphore container env + Wazuh creds seeded at kv/data/wazuh
#      Secret structure: { "ansible": "<password>" }
#   - Wazuh manager API reachable from Semaphore runner at https://10.0.69.7:55000
#
# Usage:
#   ansible-playbook playbooks/security/wazuh-push-rules.yml            # push all
#   ansible-playbook playbooks/security/wazuh-push-rules.yml -e wazuh_dry_run=true
#   ansible-playbook playbooks/security/wazuh-push-rules.yml --tags rules
#   ansible-playbook playbooks/security/wazuh-push-rules.yml --tags decoders

- name: Push Wazuh detection rules and decoders
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    wazuh_api_url: "https://10.0.69.7:55000"
    wazuh_api_verify_ssl: false
    wazuh_api_username: ansible
    wazuh_dry_run: false
    wazuh_restart_retries: 18
    wazuh_restart_delay: 10

    # Paths are relative to the repo root (two levels up from playbooks/security/)
    wazuh_rules_dir: "{{ playbook_dir }}/../../wazuh/rules"
    wazuh_decoders_dir: "{{ playbook_dir }}/../../wazuh/decoders"

    # OpenBao connection — fallback when WAZUH_API_USER/PASSWORD not directly injected
    openbao_url: "{{ lookup('env', 'VAULT_ADDR') | default(lookup('env', 'OPENBAO_ADDR') | default('https://nucbox-infra-01.svc.eskridge.internal:8200')) }}"
    openbao_token: "{{ lookup('env', 'OPENBAO_TOKEN') | default(lookup('env', 'VAULT_TOKEN')) }}"

    # Direct credentials — set via Semaphore env shell vars (WAZUH_API_USER/PASSWORD)
    # When set, OpenBao lookup is skipped entirely.
    _env_api_user: "{{ lookup('env', 'WAZUH_API_USER') }}"
    _env_api_pass: "{{ lookup('env', 'WAZUH_API_PASSWORD') }}"
    _use_direct_creds: "{{ (_env_api_user | length > 0) and (_env_api_pass | length > 0) }}"

  tasks:
    # --- Authentication ---

    - name: Verify credentials source is available
      ansible.builtin.assert:
        that:
          - (_use_direct_creds | bool) or (openbao_token | length > 0)
        fail_msg: >
          No Wazuh API credentials available. Set either:
          (A) WAZUH_API_USER + WAZUH_API_PASSWORD in Semaphore env shell vars, OR
          (B) OPENBAO_TOKEN (Komodo secret SEMAPHORE_OPENBAO_TOKEN) to fetch from
              OpenBao at {{ openbao_url }}/v1/kv/data/wazuh

    - name: Retrieve Wazuh API credentials from OpenBao
      ansible.builtin.uri:
        url: "{{ openbao_url }}/v1/kv/data/wazuh"
        method: GET
        headers:
          X-Vault-Token: "{{ openbao_token }}"
        validate_certs: false
        status_code: [200]
      register: _wazuh_creds
      no_log: true
      when: not (_use_direct_creds | bool)

    - name: Authenticate to Wazuh API
      ansible.builtin.uri:
        url: "{{ wazuh_api_url }}/security/user/authenticate"
        method: POST
        url_username: "{{ _env_api_user if (_use_direct_creds | bool) else wazuh_api_username }}"
        url_password: "{{ _env_api_pass if (_use_direct_creds | bool) else _wazuh_creds.json.data.data[wazuh_api_username] }}"
        force_basic_auth: true
        validate_certs: "{{ wazuh_api_verify_ssl }}"
        status_code: [200]
      register: _auth
      no_log: true

    - name: Set Wazuh API token
      ansible.builtin.set_fact:
        _wazuh_token: "{{ _auth.json.data.token }}"
      no_log: true

    # --- Discover local files ---

    - name: Discover local decoder XML files
      ansible.builtin.find:
        paths: "{{ wazuh_decoders_dir }}"
        patterns: "*.xml"
      register: _local_decoders
      tags: [decoders]

    - name: Discover local rule XML files
      ansible.builtin.find:
        paths: "{{ wazuh_rules_dir }}"
        patterns: "*.xml"
      register: _local_rules
      tags: [rules]

    # --- Upload decoders ---

    - name: Read local decoder file contents
      ansible.builtin.slurp:
        src: "{{ item.path }}"
      register: _decoder_contents
      loop: "{{ _local_decoders.files | sort(attribute='path') }}"
      loop_control:
        label: "{{ item.path | basename }}"
      tags: [decoders]

    - name: Get remote decoder file content
      ansible.builtin.uri:
        url: "{{ wazuh_api_url }}/decoders/files/{{ item.item.path | basename }}?raw=true"
        method: GET
        headers:
          Authorization: "Bearer {{ _wazuh_token }}"
        validate_certs: "{{ wazuh_api_verify_ssl }}"
        status_code: [200, 404]
        return_content: true
      register: _remote_decoders
      loop: "{{ _decoder_contents.results }}"
      loop_control:
        label: "{{ item.item.path | basename }}"
      tags: [decoders]

    - name: Upload changed decoder files
      ansible.builtin.uri:
        url: "{{ wazuh_api_url }}/decoders/files/{{ item.item.item.path | basename }}?overwrite=true"
        method: PUT
        headers:
          Authorization: "Bearer {{ _wazuh_token }}"
          Content-Type: "application/octet-stream"
        body: "{{ item.item.content | b64decode }}"
        validate_certs: "{{ wazuh_api_verify_ssl }}"
        status_code: [200]
      loop: "{{ _remote_decoders.results }}"
      loop_control:
        index_var: _idx
        label: "{{ item.item.item.path | basename }}"
      when:
        - not wazuh_dry_run | bool
        - >-
          item.status == 404 or
          (_decoder_contents.results[_idx].content | b64decode | trim) != (item.content | default('') | trim)
      register: _decoder_uploads
      changed_when: true
      tags: [decoders]

    - name: Preview decoder changes (dry run)
      ansible.builtin.debug:
        msg: >-
          {{ item.item.item.path | basename }}
          — {{ 'WOULD UPLOAD' if (item.status == 404 or (_decoder_contents.results[_idx].content | b64decode | trim) != (item.content | default('') | trim)) else 'unchanged' }}
      loop: "{{ _remote_decoders.results }}"
      loop_control:
        index_var: _idx
        label: "{{ item.item.item.path | basename }}"
      when: wazuh_dry_run | bool
      tags: [decoders]

    # --- Upload rules ---

    - name: Read local rule file contents
      ansible.builtin.slurp:
        src: "{{ item.path }}"
      register: _rule_contents
      loop: "{{ _local_rules.files | sort(attribute='path') }}"
      loop_control:
        label: "{{ item.path | basename }}"
      tags: [rules]

    - name: Get remote rule file content
      ansible.builtin.uri:
        url: "{{ wazuh_api_url }}/rules/files/{{ item.item.path | basename }}?raw=true"
        method: GET
        headers:
          Authorization: "Bearer {{ _wazuh_token }}"
        validate_certs: "{{ wazuh_api_verify_ssl }}"
        status_code: [200, 404]
        return_content: true
      register: _remote_rules
      loop: "{{ _rule_contents.results }}"
      loop_control:
        label: "{{ item.item.path | basename }}"
      tags: [rules]

    - name: Upload changed rule files
      ansible.builtin.uri:
        url: "{{ wazuh_api_url }}/rules/files/{{ item.item.item.path | basename }}?overwrite=true"
        method: PUT
        headers:
          Authorization: "Bearer {{ _wazuh_token }}"
          Content-Type: "application/octet-stream"
        body: "{{ item.item.content | b64decode }}"
        validate_certs: "{{ wazuh_api_verify_ssl }}"
        status_code: [200]
      loop: "{{ _remote_rules.results }}"
      loop_control:
        index_var: _idx
        label: "{{ item.item.item.path | basename }}"
      when:
        - not wazuh_dry_run | bool
        - >-
          item.status == 404 or
          (_rule_contents.results[_idx].content | b64decode | trim) != (item.content | default('') | trim)
      register: _rule_uploads
      changed_when: true
      tags: [rules]

    - name: Preview rule changes (dry run)
      ansible.builtin.debug:
        msg: >-
          {{ item.item.item.path | basename }}
          — {{ 'WOULD UPLOAD' if (item.status == 404 or (_rule_contents.results[_idx].content | b64decode | trim) != (item.content | default('') | trim)) else 'unchanged' }}
      loop: "{{ _remote_rules.results }}"
      loop_control:
        index_var: _idx
        label: "{{ item.item.item.path | basename }}"
      when: wazuh_dry_run | bool
      tags: [rules]

    # --- Reload manager if any changes were made ---

    - name: Set changed flags
      ansible.builtin.set_fact:
        _any_decoders_changed: "{{ _decoder_uploads.changed | default(false) }}"
        _any_rules_changed: "{{ _rule_uploads.changed | default(false) }}"

    - name: Restart Wazuh Manager to activate new rules
      ansible.builtin.uri:
        url: "{{ wazuh_api_url }}/manager/restart"
        method: PUT
        headers:
          Authorization: "Bearer {{ _wazuh_token }}"
        validate_certs: "{{ wazuh_api_verify_ssl }}"
        status_code: [200, 202]
      when:
        - not wazuh_dry_run | bool
        - _any_decoders_changed or _any_rules_changed
      register: _restart

    - name: Wait for manager to come back healthy after restart
      ansible.builtin.uri:
        url: "{{ wazuh_api_url }}/manager/status"
        method: GET
        headers:
          Authorization: "Bearer {{ _wazuh_token }}"
        validate_certs: "{{ wazuh_api_verify_ssl }}"
        status_code: [200]
      register: _status_check
      until: _status_check.status == 200
      retries: "{{ wazuh_restart_retries }}"
      delay: "{{ wazuh_restart_delay }}"
      when:
        - not wazuh_dry_run | bool
        - _any_decoders_changed or _any_rules_changed

    # --- Summary ---

    - name: Display push summary
      ansible.builtin.debug:
        msg: |
          Wazuh Rule Push Summary
          =======================
          {% if wazuh_dry_run | bool %}
          MODE: DRY RUN (no changes applied)
          {% endif %}
          Decoders discovered: {{ _local_decoders.matched }}
          Rules discovered:    {{ _local_rules.matched }}
          Decoders uploaded:   {{ _decoder_uploads.results | selectattr('changed', 'defined') | selectattr('changed') | list | length }}
          Rules uploaded:      {{ _rule_uploads.results | selectattr('changed', 'defined') | selectattr('changed') | list | length }}
          Manager restarted:   {{ 'yes' if (_restart is defined and _restart.status is defined) else 'no' }}
